name: Build Unsigned Desktop (Release)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target platform to build
        required: true
        default: win-x64
        type: choice
        options:
          - win-x64

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_APP_ID: com.deepseek.harness

jobs:
  build-unsigned-windows:
    name: Build Unsigned Windows Package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and Package Unsigned
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload Unsigned Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-unsigned-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts/*
          if-no-files-found: error
          retention-days: 7
