# Two failing rows inside a group; the mount diagnostic names each of them.
- id: outer
  name: cordis:group
  group: true
  config:
    - id: inner-first
      name: ../../plugins/throws.js
      config:
        message: inner first refuses
    - id: inner-second
      name: ../../plugins/throws.js
      config:
        message: inner second refuses
